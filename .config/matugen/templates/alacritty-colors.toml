[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.surface.default.hex}}"
cursor = "{{colors.on_surface.default.hex}}"

[colors.normal]
# black (dark grays)
black   = "{{colors.surface_dim.default.hex}}"
red     = "{{colors.error.default.hex}}"
green   = "{{colors.tertiary.default.hex}}"
yellow  = "{{colors.secondary.default.hex}}"
blue    = "{{colors.primary.default.hex}}"
magenta = "{{colors.inverse_primary.default.hex}}"
cyan    = "{{colors.secondary_fixed.default.hex}}"
white   = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
# bright colors
black   = "{{colors.outline.default.hex}}"
red     = "{{colors.error_container.default.hex}}"
green   = "{{colors.tertiary_container.default.hex}}"
yellow  = "{{colors.secondary_container.default.hex}}"
blue    = "{{colors.primary_container.default.hex}}"
magenta = "{{colors.surface_variant.default.hex}}"
cyan    = "{{colors.tertiary_fixed.default.hex}}"
white   = "{{colors.on_background.default.hex}}"

[colors.selection]
text = "{{colors.on_secondary.default.hex}}"
background = "{{colors.secondary_fixed_dim.default.hex}}"
