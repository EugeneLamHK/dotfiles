# Matugen-generated yazi theme

[manager]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }

# Hovered
hovered         = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
preview_hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

# Find
find_keyword  = { fg = "{{colors.error.default.hex}}", italic = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", italic = true }

# Marker
marker_copied   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

# Tab
tab_active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.outline.default.hex}}" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "{{colors.surface_container.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Mode
mode_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
mode_select = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
mode_unset  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }

# Progress
progress_label  = { fg = "{{colors.on_background.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Permissions
permissions_t = { fg = "{{colors.tertiary.default.hex}}" }
permissions_r = { fg = "{{colors.secondary.default.hex}}" }
permissions_w = { fg = "{{colors.error.default.hex}}" }
permissions_x = { fg = "{{colors.primary.default.hex}}" }
permissions_s = { fg = "{{colors.outline.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { bg = "{{colors.surface_container.default.hex}}" }

[select]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.on_surface.default.hex}}" }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[which]
cols            = 3
mask            = { bg = "{{colors.surface_dim.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{colors.tertiary.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[help]
on   = { fg = "{{colors.tertiary.default.hex}}" }
run  = { fg = "{{colors.primary.default.hex}}" }
desc = { fg = "{{colors.on_surface_variant.default.hex}}" }

[file]

[filetype]

rules = [
    # Special files
    { name = "*", is = "block", fg = "{{colors.error.default.hex}}" },
    { name = "*", is = "char", fg = "{{colors.secondary.default.hex}}" },
    { name = "*", is = "exec", fg = "{{colors.tertiary.default.hex}}" },
    { name = "*", is = "link", fg = "{{colors.primary.default.hex}}" },
    { name = "*", is = "hidden", fg = "{{colors.outline.default.hex}}" },

    # By mime type
    { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "video/*", fg = "{{colors.secondary.default.hex}}" },
    { mime = "audio/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "application/*archive*", fg = "{{colors.error.default.hex}}" },
    { mime = "application/*", fg = "{{colors.on_surface_variant.default.hex}}" },

    # Fallback
    { name = "*", fg = "{{colors.on_surface.default.hex}}" },
]
