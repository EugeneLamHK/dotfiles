# kokemusu-inspired hyprlock — MATUGEN TEMPLATE (HiDPI, scale 2)
# Do NOT edit the generated ~/.config/hypr/hyprlock.conf directly; matugen
# regenerates it from this file on every wallpaper change.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = 指紋をどうぞ
        present_message = 認証中
    }
}

background {
    monitor =
    path = {{image}}
    blur_passes = 3
    blur_size = 8
    vibrancy = 0.15
}

# ── 苔むす — margin mark, top-left ──────────────────────────────
label {
    monitor =
    text = 苔 む す
    color = rgba({{colors.on_surface.default.hex_stripped}}b3)
    font_size = 26
    font_family = Noto Sans CJK JP
    position = 80, -70
    halign = left
    valign = top
}

# ── date, small caps above the clock ────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B" | tr '[:lower:]' '[:upper:]'
    color = rgba({{colors.on_surface_variant.default.hex_stripped}}cc)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 126, 520
    halign = left
    valign = bottom
}

# ── big serif clock, low-left like the corner of a print ────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 220
    font_family = Noto Serif
    position = 118, 150
    halign = left
    valign = bottom
}

# ── greeting — the one small moss dot ───────────────────────────
label {
    monitor =
    text = ●  おかえり、$USER
    color = rgba({{colors.primary.default.hex_stripped}}e6)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 126, 100
    halign = left
    valign = bottom
}

# ── password card, low-right, solid with grey border ────────────
input-field {
    monitor =
    size = 760, 96
    outline_thickness = 2
    rounding = 16
    inner_color = rgb({{colors.surface_container_low.default.hex_stripped}})
    outer_color = rgb({{colors.outline.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span font_style="italic">password</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_color = rgb({{colors.error.default.hex_stripped}})
    check_color = rgb({{colors.primary.default.hex_stripped}})
    capslock_color = rgb({{colors.tertiary.default.hex_stripped}})
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = -120, 120
    halign = right
    valign = bottom
}

# ── "esc clears" hint under the card ────────────────────────────
label {
    monitor =
    text = esc clears
    color = rgba({{colors.outline.default.hex_stripped}}99)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -120, 80
    halign = right
    valign = bottom
}
